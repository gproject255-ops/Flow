<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0a1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Flow</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app">

    <!-- ==================== AUTH ==================== -->
    <section id="screen-auth" class="screen active">
      <div class="onboarding-inner">
        <div class="logo">Flow</div>
        <h1>Sign in</h1>
        <p class="subtitle">Save your progress across devices</p>

        <input type="email" id="auth-email" placeholder="Email" class="auth-input" />
        <input type="password" id="auth-password" placeholder="Password" class="auth-input" />

        <button id="btn-auth-submit" class="btn primary">Continue</button>
        <div id="auth-error" class="auth-error"></div>
      </div>
    </section>

    <!-- ==================== ONBOARDING ==================== -->
    <section id="screen-onboarding" class="screen">
      <div class="onboarding-inner">
        <div class="logo">Flow</div>
        <h1>What do you usually goon to?</h1>
        <p class="subtitle">Choose 1–3. This helps personalize tips later.</p>

        <div class="pref-grid" id="pref-grid">
          <button class="pref-btn" data-pref="hetero">🍆 Hetero</button>
          <button class="pref-btn" data-pref="gay">🍆 Gay</button>
          <button class="pref-btn" data-pref="lesbian">💋 Lesbian</button>
          <button class="pref-btn" data-pref="bbc">🖤 BBC</button>
          <button class="pref-btn" data-pref="hentai">🌸 Hentai</button>
          <button class="pref-btn" data-pref="mixed">🔥 Mixed</button>
        </div>

        <button id="btn-start" class="btn primary" disabled>Continue</button>
      </div>
    </section>

    <!-- rest of screens unchanged -->
    <section id="screen-home" class="screen"></section>
    <section id="screen-session" class="screen"></section>
    <section id="screen-history" class="screen"></section>
    <section id="screen-subs" class="screen"></section>

  </div>
  <script src="app.js"></script>
</body>
</html>
