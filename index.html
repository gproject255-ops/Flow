<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0a1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Flow</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app">

    <!-- ==================== AUTH ==================== -->
    <section id="screen-auth" class="screen active">
      <div class="onboarding-inner">
        <div class="logo">Flow</div>
        <h1 id="auth-title">Sign in</h1>
        <p class="subtitle" id="auth-subtitle">Save your progress across devices</p>

        <input type="email" id="auth-email" placeholder="Email" class="auth-input" />
        <input type="password" id="auth-password" placeholder="Password" class="auth-input" />

        <button id="btn-auth-submit" class="btn primary">Continue</button>
        <button id="btn-auth-toggle" class="btn secondary" style="margin-top:12px;">Create account</button>
        <div id="auth-error" class="auth-error"></div>
      </div>
    </section>

    <!-- rest of the file remains the same as before, with onboarding, home, session, history, subs screens -->
    <!-- (full content was prepared earlier) -->
  </div>
  <script src="app.js"></script>
</body>
</html>
